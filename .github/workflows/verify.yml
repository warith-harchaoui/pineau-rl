# Recomputes every number of the document from the committed results, with no training and no LaTeX.
# Linux: the analysis, check_numbers.py and the unit tests must pass; the byte-for-byte comparison of the JSON files is
# shown but does not fail the job (another processor and BLAS change the last digits of a bootstrap).
# macOS arm64, the machine family the results come from: the comparison must hold byte for byte.
name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: envs/*.txt
      - name: Install the analysis environment
        run: python -m pip install -r envs/analysis.txt -r envs/test.txt
      - name: Unit tests
        run: make test PY=python
      - name: Rerun every analysis from the committed results
        run: make analysis PY=python
      - name: Every key number of both texts
        run: make check PY=python
      - name: Byte-for-byte comparison (informational on Linux)
        continue-on-error: true
        run: git diff --stat --exit-code -- study/*.json sim/analysis/*.json sim/llm/results/*.json

  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: envs/*.txt
      - name: Install the analysis environment
        run: python -m pip install -r envs/analysis.txt -r envs/test.txt
      - name: Analysis, check, tests, then the JSON files must come back byte for byte
        run: make verify PY=python
