# Recomputes every number of the document and of the article from the committed results, with no training and no LaTeX,
# on Linux and on macOS, then compares every result file with the committed one, value by value
# (tools/compare_results.py): on macOS byte for byte; on Linux, counts, verdicts and every string exactly, floating-point
# numbers to a relative 1e-12. The environment is installed from envs/analysis.lock, every package checked by SHA-256.
name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04  # x86-64 Linux, with the author's exact Python
            python: "3.11.18"
            rtol: "1e-12"     # p-values move in their 15th or 16th digit with the maths library (at most 9.3e-15)
          - os: macos-15      # arm64 macOS, the machine family the results come from (no 3.11.18 build for it on GitHub)
            python: "3.11"
            rtol: "0"         # byte for byte
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: envs/analysis.lock
      - name: Install the analysis environment, every file checked by SHA-256
        run: python -m pip install --require-hashes -r envs/analysis.lock
      - name: Unit tests
        run: make test PY=python
      - name: Rerun every analysis from the committed results
        run: make analysis PY=python NICE=
      - name: Every key number of both documents and of the article
        run: make check PY=python
      - name: Every result value against the commit
        run: |
          git diff --stat -- study/*.json sim/analysis/*.json sim/llm/results/*.json
          python tools/compare_results.py --rtol ${{ matrix.rtol }}

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build the image of the Dockerfile
        run: docker build -t pineau-rl .
      - name: Tests and number checks inside it
        run: docker run --rm -v "$PWD":/repo pineau-rl make test check
